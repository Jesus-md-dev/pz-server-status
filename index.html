<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Poxillo - Estado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg-0: #0a0b0a;
    --bg-1: #14140f;
    --panel: #1b1c16;
    --panel-border: #33352a;
    --rust: #b5502f;
    --rust-bright: #e0703f;
    --sickly: #7a9b4e;
    --sickly-bright: #9cc45f;
    --text: #e9e6d8;
    --muted: #948d78;
    --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(181, 80, 47, 0.16), transparent 60%),
      radial-gradient(ellipse 900px 500px at 90% 110%, rgba(122, 155, 78, 0.12), transparent 60%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(233, 230, 216, 0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
  }
  .card {
    position: relative;
    width: min(440px, 100%);
    padding: 2.25rem 2rem 1.85rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(224, 112, 63, 0.35), transparent 40%, transparent 60%, rgba(156, 196, 95, 0.25));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sickly-bright);
    background: rgba(122, 155, 78, 0.12);
    border: 1px solid rgba(122, 155, 78, 0.3);
    padding: 0.32rem 0.8rem;
    border-radius: 3px;
    margin-bottom: 1.1rem;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sickly-bright);
    box-shadow: 0 0 8px 1px var(--sickly-bright);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  h1 {
    font-family: "Staatliches", "Inter", sans-serif;
    font-size: 2.4rem;
    line-height: 1;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0 0 0.4rem;
    color: var(--rust-bright);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
  }
  .subtitle {
    font-size: 0.88rem;
    color: var(--muted);
    margin: 0 0 1.6rem;
    letter-spacing: 0.01em;
  }
  .frame-wrap {
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3), 0 10px 28px -10px rgba(0, 0, 0, 0.6);
    line-height: 0;
    background: #000;
  }
  iframe {
    display: block;
    width: 100%;
    height: 260px;
    border: 0;
  }
  footer {
    margin-top: 1.4rem;
    font-size: 0.76rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  footer a {
    color: var(--rust-bright);
    text-decoration: none;
    font-weight: 600;
  }
  footer a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) {
    .badge::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Project Zomboid</span>
    <h1>Server Poxillo</h1>
    <p class="subtitle">Estado del servidor en directo</p>
    <div class="frame-wrap">
      <iframe src="https://supercraft.host/embed/server/pz-jzmarquez-com/" loading="lazy" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" title="Estado en directo del servidor"></iframe>
    </div>
    <footer>Alojado en <a href="https://supercraft.host" target="_blank" rel="noopener">supercraft.host</a></footer>
  </div>
</body>
</html>
