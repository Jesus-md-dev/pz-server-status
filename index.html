<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Poxillo - Estado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg-0: #0a0b0a;
    --bg-1: #14140f;
    --panel: #1b1c16;
    --panel-border: #33352a;
    --inner: #161d2e;
    --inner-border: #2a3450;
    --rust: #b5502f;
    --rust-bright: #e0703f;
    --sickly: #7a9b4e;
    --sickly-bright: #9cc45f;
    --red: #e05a5a;
    --text: #e9e6d8;
    --muted: #948d78;
    --tag-bg: #232b45;
    --tag-text: #a9b3d6;
    --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(181, 80, 47, 0.16), transparent 60%),
      radial-gradient(ellipse 900px 500px at 90% 110%, rgba(122, 155, 78, 0.12), transparent 60%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(233, 230, 216, 0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    mix-blend-mode: overlay;
  }
  .card {
    position: relative;
    width: min(440px, 100%);
    padding: 2.25rem 2rem 1.85rem;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    box-shadow: var(--shadow);
    text-align: center;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(224, 112, 63, 0.35), transparent 40%, transparent 60%, rgba(156, 196, 95, 0.25));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sickly-bright);
    background: rgba(122, 155, 78, 0.12);
    border: 1px solid rgba(122, 155, 78, 0.3);
    padding: 0.32rem 0.8rem;
    border-radius: 3px;
    margin-bottom: 1.1rem;
  }
  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--sickly-bright);
    box-shadow: 0 0 8px 1px var(--sickly-bright);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  h1 {
    font-family: "Staatliches", "Inter", sans-serif;
    font-size: 2.4rem;
    line-height: 1;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin: 0 0 0.4rem;
    color: var(--rust-bright);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
  }
  .subtitle {
    font-size: 0.88rem;
    color: var(--muted);
    margin: 0 0 1.6rem;
    letter-spacing: 0.01em;
  }

  .status-panel {
    background: var(--inner);
    border: 1px solid var(--inner-border);
    border-radius: 8px;
    padding: 1.1rem 1.2rem 1.25rem;
    text-align: left;
    box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.6);
  }
  .status-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.9rem;
  }
  .server-name {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--text);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 0.22rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .pill.online { color: var(--sickly-bright); background: rgba(156, 196, 95, 0.14); }
  .pill.online::before { background: var(--sickly-bright); box-shadow: 0 0 6px 1px var(--sickly-bright); }
  .pill.offline { color: var(--red); background: rgba(224, 90, 90, 0.14); }
  .pill.offline::before { background: var(--red); }
  .pill.checking { color: var(--muted); background: rgba(148, 141, 120, 0.12); }
  .pill.checking::before { background: var(--muted); }

  .info-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.9rem;
  }
  .info-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.2rem;
  }
  .info-value {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
  }
  .info-value.mono {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 0.82rem;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .tag {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--tag-text);
    background: var(--tag-bg);
    padding: 0.25rem 0.55rem;
    border-radius: 4px;
  }

  footer {
    margin-top: 1.4rem;
    font-size: 0.76rem;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  footer a {
    color: var(--rust-bright);
    text-decoration: none;
    font-weight: 600;
  }
  footer a:hover { text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) {
    .badge::before, .pill::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Project Zomboid</span>
    <h1>Server Poxillo</h1>
    <p class="subtitle">Estado del servidor en directo</p>

    <div class="status-panel">
      <div class="status-panel-header">
        <span class="server-name">Server Poxillo</span>
        <span class="pill checking" id="pill">Comprobando…</span>
      </div>
      <div class="info-row">
        <div>
          <div class="info-label">Jugadores</div>
          <div class="info-value" id="players">—</div>
        </div>
        <div>
          <div class="info-label">Dirección</div>
          <div class="info-value mono" id="address">—</div>
        </div>
      </div>
      <div class="tags">
        <span class="tag">PVE</span>
        <span class="tag">Vanilla</span>
        <span class="tag">Cooperativo</span>
      </div>
    </div>

    <footer>Alojado en <a href="https://supercraft.host" target="_blank" rel="noopener">supercraft.host</a></footer>
  </div>

<script>
  const pill = document.getElementById('pill');
  const players = document.getElementById('players');
  const address = document.getElementById('address');

  async function poll() {
    try {
      const res = await fetch('/.netlify/functions/status', { cache: 'no-store' });
      const data = await res.json();

      pill.className = 'pill ' + (data.online ? 'online' : 'offline');
      pill.textContent = data.online ? 'Online' : 'Offline';
      address.textContent = data.address || '—';

      if (data.online && data.players) {
        players.textContent = data.players.count + ' / 10';
      } else if (data.online) {
        players.textContent = '—';
      } else {
        players.textContent = '0 / 10';
      }
    } catch (e) {
      pill.className = 'pill offline';
      pill.textContent = 'Sin datos';
    }
  }

  poll();
  setInterval(poll, 5000);
</script>
</body>
</html>
